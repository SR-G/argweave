name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    uses: ./.github/workflows/verify.yml
    with:
      runner: ${{ matrix.os }}
      race: ${{ matrix.os == 'ubuntu-latest' }}

  benchmark:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark smoke test
        run: go test -run '^$' -bench=. ./...
